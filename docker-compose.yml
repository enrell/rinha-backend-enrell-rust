services:
  lb:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/lb
    platform: linux/amd64
    cpuset: ${LB_CPUSET:-0,1,2,3}
    ports:
      - "9999:9999"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      LISTEN_ADDR: 0.0.0.0:9999
      BACKEND_SOCKS: /sockets/api1.sock,/sockets/api2.sock

    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "20MB"

  api1:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/api
    platform: linux/amd64
    cpuset: ${API1_CPUSET:-0,1,2,3}
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      FD_PASS_PATH: /sockets/api1.sock
      API_WORKERS: "1"
      INDEX_PATH: /index/index.bin
      INDEX_HUGE: ${INDEX_HUGE:-1}
      INDEX_MLOCK: ${INDEX_MLOCK:-1}
      INDEX_PRIMARY_ONLY: ${INDEX_PRIMARY_ONLY:-0}
      INDEX_MAX_EXTRA_PARTITIONS: ${INDEX_MAX_EXTRA_PARTITIONS:-16}
      INDEX_STATS: ${INDEX_STATS:-false}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165MB"

  api2:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/api
    platform: linux/amd64
    cpuset: ${API2_CPUSET:-0,1,2,3}
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      FD_PASS_PATH: /sockets/api2.sock
      API_WORKERS: "1"
      INDEX_PATH: /index/index.bin
      INDEX_HUGE: ${INDEX_HUGE:-1}
      INDEX_MLOCK: ${INDEX_MLOCK:-1}
      INDEX_PRIMARY_ONLY: ${INDEX_PRIMARY_ONLY:-0}
      INDEX_MAX_EXTRA_PARTITIONS: ${INDEX_MAX_EXTRA_PARTITIONS:-16}
      INDEX_STATS: ${INDEX_STATS:-false}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165MB"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"
