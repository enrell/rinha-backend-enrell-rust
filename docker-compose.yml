services:
  lb:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/lb
    platform: linux/amd64
    ports:
      - "9999:9999"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      LISTEN_ADDR: 0.0.0.0:9999
      BACKEND_SOCKS: /sockets/api1.sock,/sockets/api2.sock

    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "20MB"

  api1:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/api
    platform: linux/amd64
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      FD_PASS_PATH: /sockets/api1.sock
      INDEX_HUGE: "true"
      INDEX_MLOCK: "true"
      INDEX_STATS: ${INDEX_STATS:-false}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165MB"

  api2:
    build: .
    image: rinha-backend-enrell-rust:local
    command: /app/api
    platform: linux/amd64
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      FD_PASS_PATH: /sockets/api2.sock
      INDEX_HUGE: "true"
      INDEX_MLOCK: "true"
      INDEX_STATS: ${INDEX_STATS:-false}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165MB"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"
